:root{
  --ink:#14201A; --muted:#5F6B65; --line:rgba(20,32,26,.09); --white:#fff;
  --a:#1E7A4C; --a2:#22B573; --soft:#DDF1E4; --paper:#F3FAF5; --tab:#CDEBD7;
  --head:Rubik,"Segoe UI",Arial,sans-serif;
  --serif:var(--head);
  --sans:Heebo,"Segoe UI",Arial,sans-serif;
  --david:"David","Times New Roman",serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--paper)}
body{background:var(--paper);font-family:var(--sans);color:var(--ink);transition:background-color .5s;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before,body::after{content:"";position:fixed;border-radius:50%;pointer-events:none;z-index:0;filter:blur(60px);transition:background .6s}
body::before{width:640px;height:540px;top:-200px;right:-140px;background:var(--tab);opacity:.85;animation:drift1 18s ease-in-out infinite alternate}
body::after{width:560px;height:480px;bottom:-220px;left:-120px;background:var(--soft);opacity:.9;animation:drift2 22s ease-in-out infinite alternate}
@keyframes drift1{to{transform:translate(-120px,80px) scale(1.1)}}
@keyframes drift2{to{transform:translate(140px,-60px) scale(1.15)}}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
b,strong{font-weight:700}
/* keycaps */
.kc{display:inline-flex;align-items:center;gap:3px;direction:ltr;white-space:nowrap}
.kc i{font-style:normal;font-family:var(--sans);font-size:12.5px;font-weight:700;min-width:26px;padding:3px 8px 4px;border-radius:7px;background:#fff;border:1px solid #cfd5d2;border-bottom-width:3px;color:#27312c;text-align:center;line-height:1.2}
.kc s{text-decoration:none;color:var(--muted);font-size:12px;font-weight:700}
.kc.big i{font-size:16px;padding:6px 12px 7px;min-width:38px;border-radius:9px}

/* key cards */
.kcard{display:flex;gap:12px;align-items:flex-start;background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px 12px}
.kcard .kn{font-size:11px;font-weight:700;color:var(--a);margin-bottom:2px}
.kcard p{font-size:13.5px;line-height:1.5;color:#36433c}
.kcard .kc{flex:none}
.kcard .kc i{min-width:62px;font-size:12px}

/* shortcut index */
.sidx{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.sidx input{width:100%;border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:9px 12px;font:inherit;font-size:14px;margin-bottom:6px;outline:none}
.sidx input:focus{border-color:var(--a)}
.sidx h4{font-family:var(--serif);font-size:16px;margin:12px 0 4px;color:var(--a)}
.srow{display:grid;grid-template-columns:150px 1fr;gap:10px;align-items:center;padding:6px 0;border-bottom:1px dashed #edf0ee;font-size:14px}
.srow:last-child{border-bottom:none}
.srow .kc{justify-content:flex-end}
.sidx .empty{color:var(--muted);font-size:13.5px;padding:10px 0}

/* ---------- practice ---------- */
.panel{flex:1;background:#fff;border:1px solid var(--line);border-radius:0 0 16px 16px;box-shadow:0 24px 50px -30px rgba(0,0,0,.3);overflow:auto;position:relative}
.hintbar{display:flex;align-items:center;gap:12px;background:#18221D;color:#fff;border-radius:14px;padding:11px 16px;font-size:14px;line-height:1.5}
.hintbar b{color:#9BE3B8;font-size:12px;flex:none;letter-spacing:.3px}
.hintbar.warn b{color:#FFC48A}
.hintbar .grow{flex:1}
.hintbar button{flex:none;background:rgba(255,255,255,.12);color:#fff;border-radius:9px;padding:6px 12px;font-size:13px}
.okbar{display:flex;align-items:center;gap:14px;background:#fff;border:1.5px solid var(--a);border-radius:14px;padding:11px 14px;animation:pop .35s ease}
.okbar .ic{width:34px;height:34px;border-radius:50%;background:var(--a);color:#fff;display:grid;place-items:center;font-size:18px;flex:none}
.okbar .tx{flex:1;font-size:14px;line-height:1.45}
.okbar .tx b{display:block;font-size:15.5px}
.okbar .btns{display:flex;gap:8px;flex:none}
.bt{border-radius:10px;padding:8px 14px;font-size:13.5px;font-weight:500;white-space:nowrap;border:1px solid var(--line);background:#fff}
.bt.pr{background:var(--ink);color:#fff;border-color:var(--ink)}
.bt.ac{background:var(--a);color:#fff;border-color:var(--a)}
@keyframes pop{0%{transform:scale(.96);opacity:0}100%{transform:none;opacity:1}}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}
.shake{animation:shake .38s}

/* ---------- simulated window ---------- */
.win{flex:1;display:flex;flex-direction:column;background:#fff;border:1px solid var(--line);border-radius:0 0 16px 16px;overflow:hidden;box-shadow:0 24px 50px -30px rgba(0,0,0,.35);position:relative;user-select:none;min-height:0}
.titlebar{height:32px;background:var(--wa);display:flex;align-items:center;justify-content:center;gap:10px;color:#fff;font-size:12.5px;position:relative;flex:none}
.titlebar .tb-app{font-weight:700;opacity:.9}
.titlebar .tb-lock{font-size:11.5px;background:rgba(255,255,255,.2);border-radius:999px;padding:1px 8px;display:none}
.titlebar .tb-lock.on{display:inline}
.dots{position:absolute;left:12px;display:flex;gap:6px}.dots i{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.45)}
.ribtabs{display:flex;gap:1px;padding:5px 10px 0;background:#F7F9F8;border-bottom:1px solid #E4E9E6;font-size:13px;flex:none;overflow-x:auto;scrollbar-width:none}
.ribtabs span{padding:6px 11px;color:#4b5650;cursor:pointer;border-bottom:2.5px solid transparent;white-space:nowrap;border-radius:6px 6px 0 0}
.ribtabs span:hover{background:#EEF2F0}
.ribtabs span.on{color:var(--wa);font-weight:700;border-bottom-color:var(--wa)}
.ribtabs span.ctxt{color:var(--wa);background:color-mix(in srgb,var(--wa) 9%,transparent)}
.ribtabs span.file{color:#fff;background:var(--wa);border-radius:6px;margin-bottom:3px;margin-left:4px;padding:3px 11px}
.ribbon{min-height:88px;background:#fff;border-bottom:1px solid #E4E9E6;display:flex;align-items:stretch;padding:6px 10px 4px;gap:0;flex:none;overflow-x:auto;scrollbar-width:thin}
.grp{display:flex;flex-direction:column;padding:0 10px;border-left:1px solid #EEF2EF;flex:none}
.grp:last-child{border-left:none}
.gb{display:flex;gap:3px;align-items:flex-start;flex:1}
.gb.col{flex-direction:column;gap:2px;justify-content:center}
.gl{font-size:10.5px;color:#8c968f;text-align:center;padding-top:2px}
.rb{width:68px;min-height:56px;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:3px;font-size:11.5px;color:#3a4540;text-align:center;line-height:1.15;cursor:pointer;padding:5px 2px 3px;position:relative}
.rb svg{width:22px;height:22px;color:#6f8078;flex:none}
.rb:hover{background:#F1F5F3}
.rchk{display:flex;align-items:center;gap:6px;font-size:12px;color:#3a4540;padding:3px 6px;border-radius:6px;cursor:pointer;white-space:nowrap}
.rchk:hover{background:#F1F5F3}
.rchk i,.drow i.cb{width:14px;height:14px;border:1.5px solid #8a9690;border-radius:3px;display:grid;place-items:center;flex:none;font-style:normal;font-size:10px;color:#fff}
.rchk.on i,.drow.on i.cb{background:var(--wa);border-color:var(--wa)}
.rchk.on i::after,.drow.on i.cb::after{content:"✓"}
.rib-empty{display:flex;align-items:center;color:#9aa49e;font-size:12.5px;padding:0 10px}
.wbody{flex:1;position:relative;overflow:hidden;min-height:0;display:flex;flex-direction:column;background:#fff}
.layer{position:absolute;inset:0;pointer-events:none;z-index:20}
.layer>*{pointer-events:auto}
.menu{position:absolute;min-width:220px;max-width:300px;background:#fff;border:1px solid #DCE3DF;border-radius:10px;box-shadow:0 16px 36px -12px rgba(0,0,0,.3);padding:5px;animation:pop .14s ease}
.mi{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:7px;font-size:13px;cursor:pointer}
.mi:hover{background:#F1F5F3}
.mi .mt{flex:1}
.mi b{display:block;font-size:13.2px;font-weight:500}
.mi small{display:block;color:var(--muted);font-size:11.5px;margin-top:1px}
.mi .arr{color:#99a39d;font-style:normal}
.mi i.cb{width:14px;height:14px;border:1.5px solid #8a9690;border-radius:3px;flex:none;font-style:normal;font-size:10px;display:grid;place-items:center;color:#fff}
.mi.on i.cb{background:var(--wa);border-color:var(--wa)}
.mi.on i.cb::after{content:"✓"}
.msep{height:1px;background:#EDF1EE;margin:4px 6px}
.dlg-back{position:absolute;inset:0;background:rgba(20,30,25,.22);display:grid;place-items:center;animation:pop .15s ease}
.dlg{width:min(520px,92%);background:#fff;border-radius:12px;box-shadow:0 30px 60px -20px rgba(0,0,0,.4);overflow:hidden;border:1px solid #DCE3DF}
.dlg-h{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;font-size:13.5px;font-weight:700;border-bottom:1px solid #EDF1EE;background:#FAFBFA}
.dlg-h span{color:#9aa49e;font-weight:400}
.dlg-b{display:flex;min-height:150px}
.dlg-side{width:140px;background:#F7F9F8;border-left:1px solid #EDF1EE;padding:6px;flex:none}
.dlg-side div{padding:7px 10px;font-size:12.8px;border-radius:6px;cursor:pointer;color:#45504a}
.dlg-side div:hover{background:#EEF2F0}
.dlg-side div.on{background:#fff;color:var(--wa);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.dlg-p{flex:1;padding:10px 14px;display:flex;flex-direction:column;gap:4px}
.dlg-p .dt{font-size:12px;color:var(--muted);margin:4px 0 2px}
.drow{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:7px;font-size:13px;cursor:pointer}
.drow:hover{background:#F4F7F5}
.drow i.rd{width:14px;height:14px;border:1.5px solid #8a9690;border-radius:50%;flex:none;position:relative}
.drow.on i.rd{border-color:var(--wa)}
.drow.on i.rd::after{content:"";position:absolute;inset:2.5px;border-radius:50%;background:var(--wa)}
.drow .fl{flex:1}
.drow .fv{min-width:120px;border:1px solid #cfd6d2;border-radius:6px;padding:4px 8px;font-size:13px;color:#99a39d;background:#fff;direction:ltr;text-align:left}
.drow.filled .fv{color:var(--ink);border-color:var(--wa)}
.drow.item{border:1px solid #EDF1EE}
.drow.item.on{background:color-mix(in srgb,var(--wa) 10%,#fff);border-color:var(--wa)}
.drow .ico{width:28px;height:28px;border-radius:6px;background:#F3EAD4;display:grid;place-items:center;flex:none;font-size:14px}
.dlg-f{display:flex;justify-content:flex-start;gap:8px;padding:10px 14px;border-top:1px solid #EDF1EE;background:#FAFBFA}
.dlg-f div{padding:6px 18px;border-radius:7px;font-size:13px;border:1px solid #cfd6d2;cursor:pointer;background:#fff}
.dlg-f div.pr{background:var(--wa);color:#fff;border-color:var(--wa)}
.pulse{position:relative;z-index:3;outline:2.5px solid var(--wa)!important;outline-offset:1px;border-radius:7px;animation:pul 1.2s ease-in-out infinite}
@keyframes pul{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--wa) 40%,transparent)}50%{box-shadow:0 0 0 7px color-mix(in srgb,var(--wa) 0%,transparent)}}
.wrongflash{animation:wf .5s}
@keyframes wf{0%,100%{background:transparent}30%{background:#FDE2DE}}
.press{transform:scale(.94);transition:transform .12s}
.fcur{position:absolute;width:22px;height:22px;z-index:40;pointer-events:none;transition:left .7s cubic-bezier(.4,.1,.2,1),top .7s cubic-bezier(.4,.1,.2,1);display:none;filter:drop-shadow(0 2px 3px rgba(0,0,0,.3))}
.fcur.on{display:block}
.wtoast{position:absolute;top:14px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:999px;padding:7px 16px;font-size:13px;z-index:30;animation:pop .2s ease;white-space:nowrap}

/* excel body */
.xl{display:flex;flex-direction:column;height:100%;min-height:0}
.xl-fx{display:flex;align-items:center;gap:8px;padding:4px 8px;border-bottom:1px solid #E4E9E6;font-size:12px;flex:none;background:#fff}
.xl-nm{width:62px;border:1px solid #d9dfdb;border-radius:4px;padding:2px 6px;font-family:var(--sans);direction:ltr;text-align:left}
.xl-f{color:#999;font-style:italic}
.xl-fv{flex:1;border:1px solid #eef1ef;border-radius:4px;padding:2px 6px;min-height:20px}
.xl-scroll{flex:1;overflow:auto;min-height:0;position:relative}
.xl-t{border-collapse:separate;border-spacing:0;font-size:12.8px;min-width:100%}
.xl-t th,.xl-t td{height:27px;border-left:1px solid #EAEFEC;border-bottom:1px solid #EAEFEC;padding:0 9px;white-space:nowrap;text-align:right;background:#fff}
.xl-t thead th{position:sticky;top:0;z-index:4;background:#F5F8F6;color:#7a8780;font-weight:500;text-align:center;font-size:11.5px;height:24px;cursor:pointer}
.xl-t th.xl-n{background:#F5F8F6;color:#7a8780;font-weight:500;text-align:center;width:38px;font-size:11.5px;position:sticky;right:0;z-index:3;cursor:pointer}
.xl-t thead th.xl-corner{z-index:5;right:0;position:sticky}
.xl-t td.xl-hd{font-weight:700;background:#F2F8F4}
.xl-t tr.selr td{background:color-mix(in srgb,var(--wa) 12%,#fff)}
.xl-t tr.selr th.xl-n,.xl-t th.selc{background:var(--wa);color:#fff;font-weight:700}
.xl-t td.selc{background:color-mix(in srgb,var(--wa) 12%,#fff)}
.xl-t td.selcell{outline:2px solid var(--wa);outline-offset:-2px}
.xl-t.frozen tbody tr:first-child td,.xl-t.frozen tbody tr:first-child th{position:sticky;top:24px;z-index:3;border-bottom:2px solid var(--wa)}
.xl-t.frozen tbody tr:first-child th{z-index:4}
.xl-t td.cfg{background:#D7F2DF!important;color:#11612f;font-weight:700}
.xl-t tr.hid{display:none}
.farr{display:inline-grid;place-items:center;width:16px;height:16px;border:1px solid #c8d0cb;border-radius:3px;font-size:8px;color:#5a6660;margin-right:6px;vertical-align:middle;background:#fff;cursor:pointer}
.farr.act{background:var(--wa);color:#fff;border-color:var(--wa)}
.xl-status{display:flex;justify-content:flex-end;gap:18px;padding:4px 12px;font-size:11.5px;color:#6b7771;border-top:1px solid #E4E9E6;background:#F7F9F8;flex:none}
.xl-sheets{display:flex;gap:2px;padding:0 8px;background:#F7F9F8;border-top:1px solid #E4E9E6;font-size:11.5px;flex:none}
.xl-sheets span{padding:4px 12px;color:#6b7771}
.xl-sheets span.on{background:#fff;color:var(--wa);font-weight:700;border-bottom:2px solid var(--wa)}
.cellbr{display:block}

/* word body */
.wd{display:flex;flex-direction:column;height:100%;background:#EEF1F4;min-height:0}
.wd-ruler{height:16px;background:#fff;border-bottom:1px solid #E1E5EA;flex:none;background-image:repeating-linear-gradient(to left,transparent 0 18px,#cfd6dd 18px 19px);background-size:100% 6px;background-repeat:repeat-x;background-position:0 10px}
.wd-scroll{flex:1;overflow:auto;padding:16px;display:flex;gap:16px;justify-content:center;align-items:flex-start;min-height:0}
.wd-page{width:330px;min-height:430px;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.12);padding:34px 30px;font-family:var(--david);font-size:12px;line-height:1.6;color:#222;position:relative;flex:none;overflow:hidden}
.wd-page h4{font-family:var(--david);font-size:14px;text-align:center;text-decoration:underline;margin-bottom:10px}
.wd-page p{margin-bottom:7px;text-align:justify}
.wd-hdr{position:absolute;top:0;left:0;right:0;height:24px;border-bottom:1px dashed transparent;font-size:10px;color:#999;display:flex;align-items:center;justify-content:center}
.wd-hdr:hover{border-bottom-color:#cfd6dd}
.wmark{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.wmark span{font-family:var(--sans);font-size:72px;font-weight:700;color:rgba(120,130,140,.18);transform:rotate(-35deg)}
.wd-tbl{width:100%;border-collapse:collapse;font-size:11px;margin-top:8px}
.wd-tbl td,.wd-tbl th{border:1px solid #9aa;padding:3px 5px;text-align:center}
.wd-tbl th{background:#E9EFF8}
.wd-tblw{position:relative;margin-top:8px}
.tplus{position:absolute;top:-9px;right:-9px;width:16px;height:16px;border:1px solid #8a96a8;background:#fff;font-size:12px;line-height:13px;text-align:center;color:#4a5668;font-family:var(--sans);cursor:pointer;z-index:2}
.wd-tblw.selt .wd-tbl{outline:2px solid var(--wa)}
.wd-tbl tr.selr th{background:color-mix(in srgb,var(--wa) 25%,#fff)}
.reprow{display:none}
.reprow.show{display:table-row;animation:pop .4s}

/* ppt body */
.pp{display:flex;height:100%;background:#F2F2F2;min-height:0}
.pp-thumbs{width:132px;background:#fff;border-left:1px solid #E5E5E5;padding:8px 10px;overflow-y:auto;flex:none;display:flex;flex-direction:column;gap:8px}
.pth{display:flex;gap:6px;align-items:flex-start;font-size:11px;color:#888;cursor:pointer;border-radius:6px;padding:2px}
.pth .tb{flex:1;aspect-ratio:16/9;background:#fff;border:1px solid #ddd;border-radius:3px;position:relative;overflow:hidden;font-size:7px;color:#555;padding:4px;font-weight:700}
.pth .tb::after{content:"";position:absolute;left:6px;right:6px;bottom:6px;height:3px;background:#eee;border-radius:2px}
.pth.cur .tb{border:2px solid var(--wa)}
.pth.hidden .tb{opacity:.4}
.pth.hidden .no{text-decoration:line-through}
.psec{font-size:10.5px;font-weight:700;color:var(--wa);padding:2px 0 0;border-top:1px solid #eee;animation:pop .3s}
.pp-stage{flex:1;display:grid;place-items:center;padding:16px;min-width:0}
.pp-slide{width:100%;max-width:520px;aspect-ratio:16/9;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.12);position:relative;overflow:hidden}
.pp-slide .stt{position:absolute;top:14%;right:8%;left:8%;font-size:26px;font-weight:700;font-family:Arial,sans-serif;color:#333;transition:font-family .3s}
.pp-slide .stx{position:absolute;top:40%;right:8%;left:30%;font-size:14px;font-family:Arial,sans-serif;color:#555;line-height:1.6}
.pp-slide.david .stt,.pp-slide.david .stx{font-family:var(--david)}
.shp{position:absolute;width:20%;height:24%;border-radius:10px;display:grid;place-items:center;color:#fff;font-size:13px;font-weight:700;transition:top .7s cubic-bezier(.3,.1,.2,1),left .7s cubic-bezier(.3,.1,.2,1)}
.shp.sel{outline:2px dashed #333;outline-offset:3px}

/* outlook body */
.ol{display:flex;height:100%;min-height:0;font-size:12.5px}
.ol-tree{width:150px;background:#F7F9F9;border-left:1px solid #E4E9E9;padding:8px 6px;flex:none;overflow:auto}
.ol-tree .fh{font-size:11px;font-weight:700;color:#7a8580;padding:6px 8px 4px}
.ofd{padding:5px 10px;border-radius:6px;cursor:pointer;display:flex;justify-content:space-between;color:#38443e}
.ofd:hover{background:#EDF2F2}
.ofd.on{background:color-mix(in srgb,var(--wa) 14%,#fff);color:var(--wa);font-weight:700}
.ofd.sub{padding-right:24px}
.ofd em{font-style:normal;color:var(--wa);font-weight:700;font-size:11px}
.ol-list{width:240px;border-left:1px solid #E4E9E9;overflow:auto;flex:none;background:#fff}
.ol-list .lh{padding:8px 12px;font-weight:700;font-size:13px;border-bottom:1px solid #EEF1F1}
.oml{padding:8px 12px;border-bottom:1px solid #F0F3F3;cursor:pointer}
.oml:hover{background:#F6F9F9}
.oml b{display:block;font-size:12.5px}
.oml span{display:block;color:#6b7771;font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.oml.sel{background:color-mix(in srgb,var(--wa) 10%,#fff);border-right:3px solid var(--wa)}
.ol-read{flex:1;padding:14px 16px;overflow:auto;color:#38443e;min-width:0}
.ol-read h5{font-size:15px;margin-bottom:4px}
.ol-read .meta{font-size:11.5px;color:#7a8580;margin-bottom:12px}
.ol-msg{position:absolute;inset:8px;background:#fff;border:1px solid #DCE3E3;border-radius:10px;box-shadow:0 20px 40px -18px rgba(0,0,0,.35);display:flex;flex-direction:column;animation:pop .2s;z-index:5}
.ol-msg .mbar{display:flex;gap:4px;align-items:center;padding:6px 10px;border-bottom:1px solid #EEF1F1;background:#FAFBFB;border-radius:10px 10px 0 0}
.ol-msg .mbar span{padding:4px 10px;border-radius:6px;font-size:12px;color:#45504a}
.ol-msg .mbar .more{font-weight:700;letter-spacing:1px;cursor:pointer;border:1px solid #DCE3E3;background:#fff}
.ol-msg .mb{padding:14px 18px;font-size:13px;line-height:1.6}
.ol-cal{flex:1;display:flex;flex-direction:column;padding:10px;min-width:0}
.ol-cal .ch{font-weight:700;font-size:14px;padding:2px 4px 8px}
.calg{flex:1;display:grid;grid-template-columns:repeat(7,1fr);grid-auto-rows:1fr;border-top:1px solid #E4E9E9;border-right:1px solid #E4E9E9;min-height:0}
.calg div{border-left:1px solid #E4E9E9;border-bottom:1px solid #E4E9E9;padding:3px 5px;font-size:11.5px;color:#45504a;overflow:hidden}
.calg .dn{background:#F7F9F9;font-weight:700;font-size:11px;text-align:center;color:#7a8580}
.calg .hd{display:block;font-size:10px;color:var(--wa);font-weight:700;opacity:0;transition:opacity .5s}
.calg.heb .hd{opacity:1}
.calg .td{background:color-mix(in srgb,var(--wa) 9%,#fff)}
.calg .wn{font-size:9.5px;color:#9aa49e}
.nfold{animation:pop .3s}

/* explorer body */
.ex{display:flex;flex-direction:column;height:100%;font-size:12.5px;min-height:0}
.ex-addr{display:flex;gap:8px;align-items:center;padding:6px 10px;border-bottom:1px solid #E6E9E7;background:#FAFBFA;color:#6b7771}
.ex-addr .ab{flex:1;border:1px solid #DDE2DF;border-radius:6px;padding:3px 8px;background:#fff;color:#38443e}
.ex-main{flex:1;display:flex;min-height:0}
.ex-nav{width:150px;border-left:1px solid #E6E9E7;padding:8px 6px;background:#FAFBFA;flex:none}
.ex-nav div{padding:5px 8px;border-radius:6px;color:#45504a}
.ex-files{flex:1;padding:6px 8px;overflow:auto}
.exh,.exr{display:grid;grid-template-columns:1fr 130px 90px;gap:8px;padding:6px 8px;align-items:center}
.exh{font-size:11.5px;color:#7a8580;border-bottom:1px solid #EEF1EF}
.exr{border-radius:6px;cursor:pointer}
.exr:hover{background:#F3F6F4}
.exr .nm{display:flex;align-items:center;gap:8px}
.exr .fi{width:22px;height:18px;border-radius:3px;background:#F2C14E;flex:none;position:relative}
.exr .fi.doc{background:#3C6FC4;width:16px;height:20px;border-radius:2px}
.exr .fi.ppt{background:#D2643C;width:16px;height:20px;border-radius:2px}
.exr .fi.xls{background:#2F8A57;width:16px;height:20px;border-radius:2px}
.exr.new{background:#EAF7EE;animation:pop .4s}
.exr.selx{background:#E4EEF9}

/* exercises (non-sim) */
.pad{padding:18px 20px}
.mcq .qn{font-size:12px;font-weight:700;color:var(--a);margin-bottom:6px}
.mcq .qq{font-family:var(--serif);font-size:21px;font-weight:700;line-height:1.35;margin-bottom:14px}
.mcq .qx{margin:-6px 0 14px}
.opts{display:grid;gap:8px}
.opt{display:flex;align-items:center;gap:12px;text-align:right;border:1.5px solid var(--line);border-radius:12px;padding:11px 14px;font-size:15px;background:#fff;transition:border-color .15s,background .15s}
.opt:hover:not([disabled]){border-color:var(--a);background:var(--paper)}
.opt .ol2{width:26px;height:26px;border-radius:8px;background:var(--paper);display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--muted);flex:none}
.opt.right{border-color:#2E9D5B;background:#EAF7EF}
.opt.right .ol2{background:#2E9D5B;color:#fff}
.opt.bad{border-color:#D8553F;background:#FDEEEB}
.opt.bad .ol2{background:#D8553F;color:#fff}
.opt[disabled]{cursor:default}
.expl{margin-top:12px;border-radius:12px;padding:11px 14px;font-size:14px;line-height:1.55;background:var(--paper);border-right:3px solid var(--a);animation:pop .25s}
.mcq .navr{display:flex;justify-content:flex-start;margin-top:14px}
.score{text-align:center;padding:24px 10px}
.score .big{font-family:var(--serif);font-size:64px;font-weight:700;color:var(--a);line-height:1}
.score p{color:var(--muted);margin-top:8px;font-size:15px}
.score .btns{display:flex;gap:8px;justify-content:center;margin-top:16px}
.ring{width:120px;height:120px;margin:0 auto 10px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--serif);font-size:34px;color:var(--a)}

.match{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.mcol{display:flex;flex-direction:column;gap:8px}
.mcol h5{font-size:12px;color:var(--muted);font-weight:700;margin-bottom:2px}
.mit{border:1.5px solid var(--line);border-radius:11px;padding:10px 12px;font-size:14.5px;text-align:right;background:#fff;display:flex;align-items:center;gap:10px;min-height:46px;transition:all .15s}
.mit:hover:not(.lock){border-color:var(--a)}
.mit.pick{border-color:var(--a);background:var(--soft);box-shadow:0 0 0 3px var(--soft)}
.mit.lock{border-color:transparent;background:var(--paper);color:var(--muted);cursor:default}
.mit .mb{width:22px;height:22px;border-radius:50%;background:var(--a);color:#fff;font-size:11px;font-weight:700;display:none;place-items:center;flex:none}
.mit.lock .mb{display:grid}

.order .slots{display:flex;flex-direction:column;gap:7px;margin-bottom:16px}
.slot{display:flex;align-items:center;gap:10px;border:1.5px dashed #cfd6d2;border-radius:11px;padding:9px 12px;min-height:44px;font-size:14.5px;color:#9aa49e}
.slot .sn{width:24px;height:24px;border-radius:7px;background:var(--paper);display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--muted);flex:none}
.slot.fill{border-style:solid;border-color:var(--a);background:var(--paper);color:var(--ink);animation:pop .25s}
.slot.fill .sn{background:var(--a);color:#fff}
.slot.next{border-color:var(--a)}
.pool{display:flex;flex-wrap:wrap;gap:8px}
.pool button{border:1.5px solid var(--line);border-radius:11px;padding:9px 14px;font-size:14.5px;background:#fff;box-shadow:0 2px 0 rgba(0,0,0,.04)}
.pool button:hover{border-color:var(--a)}
.pool.big button{font-size:20px;font-weight:700;min-width:64px;font-family:var(--sans)}
.pool .gone{visibility:hidden}

.spot .cnt{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;font-size:13.5px;color:var(--muted)}
.spot .cnt b{color:var(--a);font-size:15px}
.spotdoc{border:1px solid var(--line);border-radius:10px;padding:18px 20px;background:#fff;cursor:pointer;font-family:var(--david);font-size:16px;line-height:2}
.spotdoc [data-e]{border-radius:4px;transition:background .2s}
.spotdoc [data-e].found{background:#FFE6A8;box-shadow:0 0 0 2px #F2B33D}
.spotdoc [data-e].hintme{animation:pul2 1s 3}
@keyframes pul2{50%{background:#FFF1C9}}
.fnd{margin-top:12px;display:flex;flex-direction:column;gap:6px}
.fnd div{font-size:13.5px;line-height:1.5;background:var(--paper);border-radius:9px;padding:7px 12px;border-right:3px solid #F2B33D;animation:pop .25s}
.miss{position:absolute;background:var(--ink);color:#fff;font-size:12px;border-radius:8px;padding:4px 10px;pointer-events:none;animation:pop .15s;z-index:9;font-family:var(--sans)}

/* official doc */
.od{font-family:var(--david);font-size:12.5px;line-height:1.55;color:#222;max-width:520px;margin:0 auto;background:#fff;box-shadow:0 2px 12px rgba(0,0,0,.1);padding:22px 26px 16px;position:relative;cursor:pointer}
.od-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px}
.od-ref{font-size:11px;line-height:1.45;color:#444}
.od-emb{width:58px;height:58px}
.od-pg{position:absolute;top:8px;left:26px;font-size:10.5px;color:#555}
.od-subj{font-size:13px;margin:10px 0 8px;text-decoration:underline}
.od p{margin-bottom:5px;text-align:justify}
.od .ind{padding-right:16px}
.od .sans{font-family:var(--sans);font-size:12px}
.od-sign{margin-top:12px;text-align:center}
.od-sign b{display:block}
.od-cls{text-align:center;font-size:11px;margin-top:10px;color:#444}

/* keys drill */
.kx{display:flex;flex-direction:column;height:100%}
.kx-doc{flex:1;background:#EEF1F4;padding:18px;display:flex;justify-content:center;gap:14px;overflow:auto;min-height:170px}
.kpg{width:340px;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.12);padding:24px 26px;font-family:var(--david);font-size:14px;line-height:1.7;position:relative;transition:all .2s}
.kpg h3{font-family:var(--david);font-size:18px;margin-bottom:8px;transition:all .25s;text-align:right}
.kpg .fsel{background:#B7D4FF}
.kpg.all *{background:#B7D4FF}
.kpg .caret{display:inline-block;width:1.5px;height:1.1em;background:#111;vertical-align:-2px;animation:blink 1s steps(1) infinite;margin:0 1px}
@keyframes blink{50%{opacity:0}}
.kx-panel{border-top:1px solid var(--line);padding:14px 18px;background:#fff;display:flex;gap:16px;align-items:center}
.kx-now{flex:1}
.kx-now .kp{font-family:var(--serif);font-size:20px;font-weight:700;line-height:1.3}
.kx-now .kh{font-size:13px;color:var(--muted);margin-top:4px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.kx-now .kh .kc{margin-right:4px}
.kx-prog{display:flex;gap:4px;flex:none;flex-wrap:wrap;max-width:200px;justify-content:flex-end}
.kx-prog i{width:12px;height:12px;border-radius:4px;background:#E3E8E5}
.kx-prog i.d{background:var(--a)}
.kx-prog i.n{background:var(--tab);outline:2px solid var(--a)}
.kfb{font-size:13px;margin-top:6px;min-height:19px;color:#B9472F}
.kfb.ok{color:#2E9D5B}
.focusmask{position:absolute;inset:0;background:rgba(255,255,255,.82);display:grid;place-items:center;z-index:8;backdrop-filter:blur(2px)}
.focusmask button{background:var(--ink);color:#fff;border-radius:12px;padding:12px 20px;font-size:15px}
.cell-ed{outline:2px solid #1E7A4C;outline-offset:-2px;background:#fff!important;white-space:normal!important;height:auto!important;padding:4px 9px!important}

/* virtual keyboard */
.vkw{overflow:hidden;padding:16px 14px;display:flex;flex-direction:column;gap:12px;align-items:center;height:100%;justify-content:center}
.vkq{text-align:center}
.vkq .kp{font-family:var(--serif);font-size:22px;font-weight:700}
.vkq .kh{font-size:13px;color:var(--muted);margin-top:3px;min-height:20px}
.vkq .kh.ok{color:#2E9D5B;font-weight:500}
.vkq .kh.bad{color:#B9472F;font-weight:500}
.vk{direction:ltr;display:flex;gap:calc(var(--u)*.35);background:#2a2f2d;padding:calc(var(--u)*.35);border-radius:12px;box-shadow:0 18px 40px -20px rgba(0,0,0,.6)}
.vkb{display:flex;flex-direction:column;gap:calc(var(--u)*.12)}
.vkr{display:flex;gap:calc(var(--u)*.12);height:var(--u)}
.vkr.f{margin-bottom:calc(var(--u)*.2)}
.vkey{width:calc(var(--u)*var(--w,1) + var(--u)*.12*(var(--w,1) - 1));height:100%;background:#444a47;border-radius:5px;color:#e9ecea;font-size:calc(var(--u)*.3);display:flex;flex-direction:column;justify-content:space-between;padding:3px 4px;line-height:1;cursor:pointer;box-shadow:inset 0 -2px 0 rgba(0,0,0,.35);font-family:var(--sans);position:relative;transition:background .15s}
.vkey:hover{background:#565d59}
.vkey .h{align-self:flex-end;font-size:calc(var(--u)*.28);color:#b9c2bd}
.vkey.gap{visibility:hidden}
.vkey.ok{background:#2E9D5B}
.vkey.bad{background:#C9472F}
.vkey.tall{height:calc(var(--u)*2 + var(--u)*.12)}
.vkey .tip{position:absolute;bottom:115%;left:50%;transform:translateX(-50%);background:#fff;color:#18221D;font-size:12px;padding:3px 8px;border-radius:6px;white-space:nowrap;box-shadow:0 4px 12px rgba(0,0,0,.2);font-weight:700}
.vkdone{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.vkdone span{font-size:12px;background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:3px 10px;color:var(--a);font-weight:500}

/* ===================== v2 layout ===================== */
.app{position:relative;z-index:1;max-width:1600px;margin:0 auto;padding:14px 34px 26px;min-height:100vh;display:flex;flex-direction:column}
.app.fixed{height:100vh;min-height:0;padding-bottom:16px}
.nav{display:flex;align-items:center;justify-content:space-between;gap:14px;background:rgba(255,255,255,.74);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.95);box-shadow:0 10px 30px -18px rgba(0,30,20,.35);border-radius:999px;padding:6px 10px 6px 14px;position:sticky;top:10px;z-index:50}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--head);font-weight:800;font-size:19px;cursor:pointer;white-space:nowrap;padding-right:2px}
.brand img{width:38px;height:38px;display:block}
.pills{display:flex;gap:2px;flex-wrap:wrap;justify-content:center}
.pill{font-family:var(--head);font-weight:500;font-size:13.5px;padding:8px 13px;border-radius:999px;color:#47534d;display:flex;align-items:center;gap:7px;transition:background .2s,color .2s}
.pill:hover{background:rgba(0,0,0,.05)}
.pill i{width:8px;height:8px;border-radius:50%;flex:none}
.pill.on{background:var(--ink);color:#fff}
.pill .dn{font-size:10.5px;color:#2E9D5B}
.pill.on .dn{color:#9BE3B8}
.prog{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--muted);font-weight:500;white-space:nowrap}
.ring2{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;flex:none}
.ring2 b{width:28px;height:28px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:9.5px;color:var(--ink);font-family:var(--head);font-weight:700}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:16px;flex-wrap:wrap}
.bar .r{display:flex;align-items:center;gap:10px}
.back{display:flex;align-items:center;gap:8px;font-family:var(--head);font-weight:500;font-size:14px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:9px 18px;box-shadow:0 4px 14px -8px rgba(0,0,0,.2);transition:transform .2s}
.back:hover{transform:translateX(3px)}
.back span{font-size:15px}
.crumb{position:relative}
.crumb>button{font-size:13.5px;color:var(--muted);font-weight:500;padding:8px 12px;border-radius:12px;display:flex;gap:6px;align-items:center}
.crumb>button b{color:var(--a)}
.crumb>button:hover{background:rgba(255,255,255,.75)}
.ldd{position:absolute;top:110%;right:0;background:#fff;border-radius:16px;box-shadow:0 24px 50px -20px rgba(0,0,0,.35);padding:6px;min-width:280px;z-index:60;border:1px solid var(--line);display:none}
.crumb.open .ldd{display:block;animation:pop .15s}
.ldd button{display:flex;width:100%;gap:10px;align-items:center;padding:9px 12px;border-radius:10px;font-size:14px;text-align:right}
.ldd button:hover{background:var(--paper)}
.ldd button.on{background:var(--soft)}
.ldd .n{font-family:var(--head);font-weight:700;font-size:12px;color:var(--a);width:28px}
.ldd .ck{margin-right:auto;color:#2E9D5B;font-size:12px}
.seg{display:flex;background:rgba(255,255,255,.82);border:1px solid var(--line);border-radius:999px;padding:4px;gap:2px}
.seg button{font-family:var(--head);font-weight:500;font-size:14px;padding:8px 18px;border-radius:999px;color:var(--muted);display:flex;gap:8px;align-items:center;transition:all .2s}
.seg button em{font-style:normal;width:20px;height:20px;border-radius:50%;background:#E6ECE9;display:grid;place-items:center;font-size:11px}
.seg button.on{background:var(--a);color:#fff;box-shadow:0 6px 16px -8px var(--a)}
.seg button.on em{background:rgba(255,255,255,.25);color:#fff}

/* learn page */
.learn{animation:rise .45s cubic-bezier(.3,.7,.2,1)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:30px;margin:22px 0 22px}
.kick{font-family:var(--head);font-weight:700;font-size:12.5px;letter-spacing:1px;color:var(--a);margin-bottom:8px}
h1{font-family:var(--head);font-weight:800;font-size:clamp(36px,3.9vw,58px);line-height:1.04;letter-spacing:-1.3px}
h1 em{font-style:normal;background:linear-gradient(90deg,var(--a),var(--a2));-webkit-background-clip:text;background-clip:text;color:transparent}
.lead{font-size:17px;line-height:1.6;color:#3a4741;max-width:580px;margin-top:12px}
.hint2{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);background:rgba(255,255,255,.75);border-radius:14px;padding:10px 14px;border:1px solid var(--line);white-space:nowrap}
.hint2 b{color:var(--ink)}
.hint2 .sp{display:inline-block;animation:spin 3s linear infinite;color:var(--a);font-size:15px}
@keyframes spin{to{transform:rotate(-360deg)}}
.bento{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:178px;grid-auto-flow:dense;gap:14px}
.bento.keys{grid-auto-rows:132px}
.tile{perspective:1400px;cursor:pointer}
.tile.w2{grid-column:span 2}.tile.h2{grid-row:span 2}
.tin{position:relative;width:100%;height:100%;transition:transform .75s cubic-bezier(.3,.7,.2,1);transform-style:preserve-3d}
.tile:hover:not(.flip) .tin{transform:rotateY(-8deg) translateY(-4px)}
.tile.flip .tin{transform:rotateY(180deg)}
.tf,.tb2{position:absolute;inset:0;border-radius:22px;backface-visibility:hidden;-webkit-backface-visibility:hidden;padding:18px 20px;display:flex;flex-direction:column;overflow:hidden}
.tf{background:#fff;border:1px solid rgba(255,255,255,.95);box-shadow:0 14px 34px -22px rgba(0,40,25,.45)}
.tf .ic{width:46px;height:46px;border-radius:15px;background:var(--soft);display:grid;place-items:center;color:var(--a);flex:none}
.tf .ic svg{width:24px;height:24px}
.tf h3{font-family:var(--head);font-weight:700;font-size:19px;line-height:1.22;margin-top:auto;position:relative}
.tf p{font-size:13px;color:var(--muted);margin-top:5px;position:relative}
.tf .rot{position:absolute;top:18px;left:18px;width:30px;height:30px;border-radius:50%;border:1.5px dashed #c3d0c9;display:grid;place-items:center;color:#8a9a91;font-size:14px;transition:transform .5s}
.tile:hover .tf .rot{transform:rotate(-180deg)}
.tf.hero2{background:linear-gradient(150deg,var(--a),var(--a2));color:#fff;border:none}
.tf.hero2 .ic{background:rgba(255,255,255,.2);color:#fff;width:58px;height:58px;border-radius:18px}
.tf.hero2 .ic svg{width:30px;height:30px}
.tf.hero2 h3{font-size:clamp(24px,2.2vw,32px);line-height:1.1}
.tf.hero2 p{color:rgba(255,255,255,.85);font-size:15px}
.tf.hero2 .rot{border-color:rgba(255,255,255,.55);color:#fff}
.bigic{position:absolute;left:-30px;bottom:-40px;width:250px;height:250px;color:#fff;opacity:.13;transform:rotate(-12deg)}
.bigic svg{width:100%;height:100%}
.tb2{transform:rotateY(180deg);background:#fff;border:2px solid var(--a);box-shadow:0 20px 40px -24px rgba(0,0,0,.4);overflow-y:auto;scrollbar-width:thin}
.tb2 h4{font-family:var(--head);font-weight:700;font-size:16.5px;color:var(--a);margin-bottom:6px;display:flex;justify-content:space-between;gap:8px;line-height:1.25}
.tb2 h4 span{color:#9aa7a0;font-size:15px;flex:none}
.tb2 p{font-size:14px;line-height:1.55;color:#33413a}
.tb2 p b{color:var(--ink)}
.tb2 .exbox{margin-top:8px;font-size:14px}
.tb2 .keys{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.steps2{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;align-items:center}
.st2{display:flex;align-items:center;gap:6px;background:var(--paper);border-radius:10px;padding:5px 10px 5px 8px;font-size:12.8px;font-weight:500;opacity:.2}
.st2 i{font-style:normal;width:18px;height:18px;border-radius:6px;background:var(--a);color:#fff;font-size:10.5px;display:grid;place-items:center;font-family:var(--head)}
.tile.flip .st2{animation:lit .35s forwards;animation-delay:calc(var(--i) * .4s + .55s)}
@keyframes lit{to{opacity:1}}
.steps2 .ar{color:var(--a);font-weight:700;font-size:12px}
.tile.guess .tf{background:var(--ink);color:#fff;border:none}
.tile.guess .tf .ic{background:rgba(255,255,255,.1);color:var(--tab);font-family:var(--head);font-weight:800;font-size:20px}
.gtag{position:absolute;top:18px;left:18px;font-family:var(--head);font-weight:700;font-size:11px;background:var(--tab);color:var(--ink);border-radius:999px;padding:3px 10px}
.tile.guess h3{font-size:16.5px;margin-top:auto}
.gopts{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.gopts button{font-size:13px;padding:7px 12px;border-radius:999px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);color:#fff;transition:all .2s}
.gopts button:hover{background:rgba(255,255,255,.22);transform:translateY(-1px)}
.gopts button.right{background:#2E9D5B;border-color:#2E9D5B}
.gopts button.bad{background:#D8553F;border-color:#D8553F}
.gopts .kc i{background:rgba(255,255,255,.95)}
.verdict{font-size:12.5px;font-weight:700;border-radius:999px;padding:3px 10px;align-self:flex-start;margin-bottom:8px}
.verdict:empty{display:none}
.verdict.ok{background:#E3F5EA;color:#1D7A45}.verdict.no{background:#FDECE8;color:#B9472F}
.tile.kt .tf{align-items:center;justify-content:center;gap:10px;text-align:center}
.tile.kt .tf p{margin:0}
.tile.kt .tb2{justify-content:center}
.kbshow{margin:0 0 18px;display:flex;justify-content:center;background:rgba(255,255,255,.6);border-radius:22px;padding:16px;border:1px solid rgba(255,255,255,.95)}
.kbshow .vk{box-shadow:0 18px 40px -24px rgba(0,0,0,.6)}
.vkey.lit{background:var(--a2);color:#fff;box-shadow:0 0 0 2px #fff,0 0 22px var(--a2)}
.quote{margin-top:18px;border-radius:22px;padding:20px 26px;background:linear-gradient(120deg,var(--soft),rgba(255,255,255,.75));font-family:var(--head);font-weight:700;font-size:20px;line-height:1.4;display:flex;gap:16px;align-items:center;border:1px solid rgba(255,255,255,.95)}
.quote span{font-size:52px;color:var(--a);line-height:.6;padding-top:14px}
.cta{margin-top:18px;display:flex;align-items:center;justify-content:space-between;gap:16px;background:#fff;border-radius:22px;padding:14px 16px 14px 24px;border:1px solid rgba(255,255,255,.95);box-shadow:0 14px 34px -24px rgba(0,50,25,.45)}
.cta .tx{font-size:14.5px;color:var(--muted)}
.cta .tx b{color:var(--ink);font-family:var(--head);font-weight:700;font-size:16px;margin-left:8px}
.go{font-family:var(--head);font-weight:700;font-size:16px;background:var(--ink);color:#fff;border-radius:16px;padding:13px 26px;display:flex;gap:10px;align-items:center;white-space:nowrap;box-shadow:0 12px 26px -14px rgba(0,0,0,.6);transition:transform .2s}
.go:hover{transform:translateX(-3px)}
.tryit{display:flex;align-items:center;gap:14px;background:var(--ink);color:#fff;border-radius:18px;padding:14px 18px;margin-bottom:14px;font-size:15px}
.tryit b{color:var(--tab);font-family:var(--head)}
.tryit .ti{font-size:24px}
.sidx{border-radius:22px;padding:18px 22px;border:1px solid rgba(255,255,255,.95);box-shadow:0 14px 34px -24px rgba(0,50,25,.45)}
.sidx h4{font-family:var(--head);font-weight:700}
.sgr{display:grid;grid-template-columns:1fr 1fr;column-gap:30px}
.srow.hit{background:var(--soft);border-radius:10px;animation:hit 1.2s ease}
@keyframes hit{0%{box-shadow:0 0 0 0 var(--a2)}30%{box-shadow:0 0 0 6px transparent}}

/* practice page */
.ptop{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin:16px 0 12px;flex-wrap:wrap}
.ptop h2{font-family:var(--head);font-weight:800;font-size:28px;letter-spacing:-.5px;line-height:1.15}
.ptop h2 small{display:block;font-family:var(--sans);font-weight:400;font-size:14px;color:var(--muted);letter-spacing:0;margin-top:3px}
.pctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tks{display:flex;gap:6px;flex-wrap:wrap}
.tk{font-family:var(--head);font-weight:500;font-size:13px;padding:7px 13px 7px 12px;border-radius:12px;background:rgba(255,255,255,.78);border:1px solid var(--line);color:var(--muted);display:flex;gap:8px;align-items:center;white-space:nowrap}
.tk i{font-style:normal;width:20px;height:20px;border-radius:7px;background:#E6ECE9;display:grid;place-items:center;font-size:11px}
.tk.dn i{background:#2E9D5B;color:#fff}
.tk.on{background:#fff;color:var(--ink);border-color:var(--a);box-shadow:0 0 0 3px var(--soft)}
.tk.on i{background:var(--a);color:#fff}
.modes{display:flex;background:rgba(255,255,255,.85);border:1px solid var(--line);border-radius:14px;padding:4px;gap:2px}
.modes button{font-family:var(--head);font-weight:500;font-size:13px;padding:6px 13px;border-radius:10px;color:var(--muted);white-space:nowrap}
.modes button.on{background:var(--soft);color:var(--a)}
.modes button .st{color:#E0A100}
.remind{font-family:var(--head);font-weight:500;font-size:13.5px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 14px;white-space:nowrap}
.prac{flex:1;display:flex;flex-direction:column;min-height:0;animation:rise .4s cubic-bezier(.3,.7,.2,1)}
.exhost{flex:1;min-height:380px;display:flex;flex-direction:column;position:relative}
.exfoot{min-height:52px;margin-top:12px}
.win,.panel{border-radius:22px!important;border:1px solid rgba(255,255,255,.95)!important;box-shadow:0 30px 60px -36px rgba(0,50,25,.55)!important}
.hintbar,.okbar{border-radius:16px}
.okbar .tx b{font-family:var(--head)}
.bt{font-family:var(--head)}
.drawer{position:fixed;top:0;bottom:0;left:0;width:min(440px,92vw);background:#fff;box-shadow:30px 0 60px -30px rgba(0,0,0,.45);z-index:90;transform:translateX(-105%);transition:transform .35s cubic-bezier(.3,.7,.2,1);display:flex;flex-direction:column}
.drawer.open{transform:none}
.dscrim{position:fixed;inset:0;background:rgba(10,20,15,.25);z-index:89;opacity:0;pointer-events:none;transition:opacity .3s}
.dscrim.open{opacity:1;pointer-events:auto}
.drawer .dh{display:flex;justify-content:space-between;align-items:center;padding:18px 20px;border-bottom:1px solid var(--line);font-family:var(--head);font-weight:700;font-size:18px}
.drawer .dh button{width:32px;height:32px;border-radius:50%;background:var(--paper)}
.drawer .db{overflow:auto;padding:14px 18px;display:flex;flex-direction:column;gap:10px}
.dc{border-radius:14px;background:var(--paper);padding:12px 14px}
.dc>b{font-family:var(--head);display:block;margin-bottom:3px}
.dc p{font-size:13.5px;line-height:1.55;color:#3a4741}

/* cover */
.cv{flex:1;display:grid;grid-template-columns:1fr 1.05fr;gap:52px;align-items:center;padding:30px 0 10px;animation:rise .5s cubic-bezier(.3,.7,.2,1)}
.cv-emb{width:108px;height:108px;display:block;margin-bottom:16px;filter:drop-shadow(0 14px 22px rgba(0,0,0,.2))}
.cv-k{font-family:var(--head);font-weight:700;font-size:13px;letter-spacing:.6px;color:var(--muted)}
.cv-t{font-family:var(--head);font-weight:800;font-size:clamp(64px,7.6vw,124px);line-height:.94;letter-spacing:-3px;margin:10px 0 18px}
.cv-t em{font-style:normal;background:linear-gradient(90deg,#22B3BB,#EE7A4E 30%,#22B573 55%,#4A8BE0 78%,#9A7BE0);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:flow 8s ease-in-out infinite alternate}
@keyframes flow{to{background-position:100% 0}}
.cv-lead{font-size:18px;line-height:1.6;color:#3a3f3c;max-width:560px}
.cv-cta{display:flex;align-items:center;gap:16px;margin-top:26px}
.cv-cta .sub{font-size:13px;color:var(--muted);line-height:1.5}
.cv-done{margin-top:18px;background:#fff;border-radius:16px;padding:12px 16px;font-size:14.5px;box-shadow:0 10px 30px -20px rgba(0,0,0,.3)}
.cv-gl{font-family:var(--head);font-weight:700;font-size:12.5px;color:var(--muted);margin-top:30px;letter-spacing:.4px}
.cv-goals{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;max-width:620px}
.cv-goals span{background:rgba(255,255,255,.8);border:1px solid rgba(255,255,255,.95);border-radius:999px;padding:7px 14px 7px 12px;font-size:13.5px;display:flex;gap:8px;align-items:center}
.cv-goals b{font-family:var(--head);font-size:12px;color:#9a9484}
.cv-by{font-size:12.5px;color:var(--muted);margin-top:18px}
.cv-by button{text-decoration:underline;font-size:12px;color:var(--muted)}
.chs{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.chc{position:relative;overflow:hidden;text-align:right;background:#fff;border-radius:24px;padding:18px 20px 16px;min-height:138px;display:flex;flex-direction:column;box-shadow:0 14px 34px -24px rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.95);transition:transform .3s cubic-bezier(.3,.7,.2,1),box-shadow .3s}
.chc:first-child{grid-column:span 2;min-height:150px;background:linear-gradient(140deg,var(--c),var(--c2));color:#fff}
.chc:first-child .ds,.chc:first-child .pn{color:rgba(255,255,255,.85)}
.chc:first-child .no{color:rgba(255,255,255,.9)}
.chc::after{content:"";position:absolute;width:130px;height:130px;border-radius:50%;background:var(--cs);left:-40px;top:-50px;transition:transform .4s;z-index:0}
.chc:first-child::after{background:rgba(255,255,255,.15)}
.chc>*{position:relative;z-index:1}
.chc:hover{transform:translateY(-4px) rotate(-.5deg);box-shadow:0 24px 40px -24px rgba(0,0,0,.45)}
.chc:hover::after{transform:scale(1.4)}
.chc .no{font-family:var(--head);font-weight:800;font-size:14px;color:var(--c)}
.chc .nm{font-family:var(--head);font-weight:800;font-size:24px;margin-top:auto;line-height:1.1}

function calBody(){const d=new Date();const y=d.getFullYear(),m=d.getMonth();const first=new Date(y,m,1).getDay();const days=new Date(y,m+1,0).getDate();
  let fmt=null;try{fmt=new Intl.DateTimeFormat('he-IL-u-ca-hebrew',{day:'numeric',month:'long'})}catch(e){}
  const mon=new Intl.DateTimeFormat('he-IL',{month:'long',year:'numeric'}).format(d);
  let g=['א','ב','ג','ד','ה','ו','ש'].map(x=>`<div class="dn">${x}</div>`).join('');
  for(let i=0;i<first;i++)g+='<div></div>';
  for(let day=1;day<=days;day++){const dt=new Date(y,m,day);let hd='';try{hd=fmt?fmt.formatToParts(dt).map(p=>p.type=='day'?gem(+p.value):p.type=='month'?p.value.replace(/^ב/,''):p.type=='literal'?' ':'').join('').replace(/\s+/g,' ').trim():''}catch(e){}
    g+=`<div class="${day==d.getDate()?'td':''}">${day}<span class="hd">${hd}</span></div>`}
  return `<div class="ol">${OL_TREE().replace('תיבת הדואר','לוחות שנה').replace(/דואר נכנס <em>4<\/em>|טיוטות|פריטים שנשלחו|פריטים שנמחקו|ארכיון/g,(x)=>({'טיוטות':'לוח השנה שלי','פריטים שנשלחו':'לו"ז מחלקה','פריטים שנמחקו':'לו"ז רמ"ד','ארכיון':'חגים בישראל'}[x]||'לוח שנה'))}<div class="ol-cal"><div class="ch">${mon}</div><div class="calg">${g}</div></div></div>`}
function exBody(o){return `<div class="ex"><div class="ex-addr"><span>‹ › ↑</span><div class="ab">${o.addr}</div></div><div class="ex-main"><div class="ex-nav"><div>⭐ גישה מהירה</div><div>🖥 שולחן העבודה</div><div>📁 מסמכים</div><div>🗂 כונן משותף (S:)</div></div><div class="ex-files"><div class="exh"><span>שם</span><span>תאריך שינוי</span><span>סוג</span></div>${o.rows.map(r=>`<div class="exr"${r.t?` data-t="${r.t}"`:''}><span class="nm"><i class="fi ${r.k||''}"></i>${r.n}</span><span>${r.d}</span><span>${r.ty||'תיקיית קבצים'}</span></div>`).join('')}</div></div></div>`}

  const m=OS==='mac';return `<div class="vk${m?' mac':''}"><div class="vkb">${(m?VKM_MAIN:VK_MAIN).map(row).join('')}</div><div class="vkb">${(m?VKM_NAV:VK_NAV).map(row).join('')}</div><div class="vkb">${(m?VKM_NUM:VK_NUM).map(row).join('')}</div></div>`}
function kbEx(host,foot,ex,done){
  host.innerHTML=`<div class="panel"><div class="vkw"><div class="vkq"><div class="kp"></div><div class="kh"></div></div><div class="vkbox" style="width:100%;display:flex;justify-content:center">${vkHtml()}</div><div class="vkdone"></div></div></div>`;
  const box=$('.vkbox',host);const fit=()=>{const w=box.clientWidth-10;box.style.setProperty('--u',Math.max(16,Math.min(40,w/24.6))+'px')};fit();const ro=new ResizeObserver(fit);ro.observe(box);
  let i=0,busy=false;const it=ex.items;
  function show(){$('.kp',host).innerHTML=it[i].p;$('.kh',host).className='kh';$('.kh',host).innerHTML=`${i+1} מתוך ${it.length} · לחצו על המקש במקלדת שעל המסך או במקלדת שלכם${it[i].note?`<br><b style="color:var(--a)">${it[i].note}</b>`:''}`;
    foot.innerHTML=`<div class="hintbar"><b>מקלדת</b><span class="grow">${ex.note||'המקלדת על המסך זהה למקלדת שבסדנה. גם לחיצה על המקלדת האמיתית נקלטת.'}</span></div>`}
  function tryKey(code,el){if(busy||i>=it.length)return;el=el||$(`.vkey[data-code="${code}"]`,host)||$$('.vkey',host).find(k=>normCode(k.dataset.code)==normCode(code));
    if(normCode(code)===normCode(it[i].k)){busy=true;el&&el.classList.add('ok');$('.kh',host).className='kh ok';$('.kh',host).innerHTML='✓ נכון – '+(it[i].e||'');
      $('.vkdone',host).insertAdjacentHTML('beforeend',`<span>${it[i].n||el?.textContent||code}</span>`);
      setTimeout(()=>{el&&el.classList.remove('ok');busy=false;i++;if(i>=it.length){KEYHANDLER=null;$('.kp',host).textContent='מצאתם את כל המקשים!';$('.kh',host).textContent='';done('g')}else show()},1100)}
    else if(el){el.classList.add('bad');const nm=el.querySelector('span').textContent||'רווח';el.insertAdjacentHTML('beforeend',`<span class="tip">זה ${nm}</span>`);$('.kh',host).className='kh bad';$('.kh',host).textContent='לא זה – נסו שוב.';setTimeout(()=>{el.classList.remove('bad');el.querySelector('.tip')?.remove()},900)}}
  host.addEventListener('click',e=>{const k=e.target.closest('.vkey[data-code]');if(k)tryKey(k.dataset.code,k)});
  KEYHANDLER=(e,ph)=>{const pr=e.code==='PrintScreen';if(ph==='up'&&!pr)return;if(ph==='down'&&pr)return;if(e.repeat)return;if(e.code==='Tab'||e.code==='Escape'||/^F\d/.test(e.code)||e.code.startsWith('Page')||e.code==='Home'||e.code==='End'||e.code==='Backspace')e.preventDefault();tryKey(e.code)};
  show();return {destroy(){KEYHANDLER=null;ro.disconnect()}}
}

/* ===================== multiple choice ===================== */
function mcqEx(host,foot,ex,done){
  host.innerHTML=`<div class="panel"><div class="pad mcq"></div></div>`;const box=$('.mcq',host);
  const Q=ex.q.map(q=>{const o=q.o.map((t,j)=>({t,r:j===(q.a||0)}));return Object.assign({},q,{opts:ex.noShuffle?o:shuffle(o)})});
  let i=0,score=0;
  function render(){const q=Q[i];const kcq=ex.kc||q.kc;
    box.innerHTML=`<div class="qn">שאלה ${i+1} מתוך ${Q.length}</div><div class="qq">${q.q}</div>${q.x?`<div class="qx">${q.x}</div>`:''}<div class="opts">${q.opts.map((o,j)=>`<button class="opt" data-j="${j}"><span class="ol2">${'אבגד'[j]}</span><span>${kcq?kc(o.t):o.t}</span></button>`).join('')}</div><div class="ex2"></div>`;
    foot.innerHTML=`<div class="hintbar"><b>${ex.quiz?'מבחן':'בדיקה'}</b><span class="grow">${ex.quiz?'בחרו תשובה אחת. בסוף תקבלו ציון.':'בחרו את התשובה הנכונה. אחרי הבחירה יופיע הסבר.'}</span><span style="font-size:12.5px;opacity:.75">${score} נכונות</span></div>`}
  box.addEventListener('click',e=>{const b=e.target.closest('.opt');if(b&&!b.disabled){const q=Q[i],o=q.opts[+b.dataset.j];
      $$('.opt',box).forEach((x,j)=>{x.disabled=true;if(q.opts[j].r)x.classList.add('right')});if(!o.r)b.classList.add('bad');else score++;
      $('.ex2',box).innerHTML=`<div class="expl"><b>${o.r?'נכון!':'לא בדיוק.'}</b> ${q.e||''}</div><div class="navr"><button class="bt pr" data-nx>${i<Q.length-1?'לשאלה הבאה ←':'סיום'}</button></div>`;
      foot.querySelector('.hintbar span:last-child').textContent=score+' נכונות'}
    if(e.target.closest('[data-nx]')){i++;if(i<Q.length)render();else end()}
    if(e.target.closest('[data-again]')){i=0;score=0;Q.forEach(q=>q.opts=shuffle(q.opts));render()}});
  function end(){const pct=Math.round(score/Q.length*100);const C=2*Math.PI*52;
    box.innerHTML=`<div class="score">${ex.quiz?`<div class="ring"><svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="52" fill="none" stroke="var(--soft)" stroke-width="10"/><circle cx="60" cy="60" r="52" fill="none" stroke="var(--a)" stroke-width="10" stroke-linecap="round" stroke-dasharray="${C*pct/100} ${C}"/></svg><b>${score}/${Q.length}</b></div>`:`<div class="big">${score}/${Q.length}</div>`}<p>${pct>=80?'מצוין! שולטים בחומר.':pct>=60?'יפה – כדאי לעבור שוב על הנקודות שפספסתם.':'שווה לחזור לכתבה ולנסות שוב.'}</p><div class="btns"><button class="bt" data-again>לנסות שוב</button></div></div>`;
    done('g',null,score,Q.length)}
  render();return {destroy(){}}
}

/* ===================== match ===================== */
function matchEx(host,foot,ex,done){
  host.innerHTML=`<div class="panel"><div class="pad"><div class="match"><div class="mcol L"><h5>${ex.lh||'מה רוצים לעשות'}</h5></div><div class="mcol R"><h5>${ex.rh||'איך עושים את זה'}</h5></div></div></div></div>`;
  const P2=ex.pairs.map((p,i)=>({l:p[0],r:p[1],i}));const Lc=$('.L',host),Rc=$('.R',host);
  shuffle(P2).forEach(p=>Lc.insertAdjacentHTML('beforeend',`<button class="mit" data-ml="${p.i}"><span class="mb"></span><span>${ex.kcl&&isCombo(p.l)?kc(p.l):p.l}</span></button>`));
  shuffle(P2).forEach(p=>Rc.insertAdjacentHTML('beforeend',`<button class="mit" data-mr="${p.i}"><span class="mb"></span><span>${ex.kcr&&isCombo(p.r)?kc(p.r):p.r}</span></button>`));
  let pickL=null,pickR=null,n=0,err=0;
  const tip=(t,w)=>foot.innerHTML=`<div class="hintbar${w?' warn':''}"><b>${w?'לא מתאים':'חיבור'}</b><span class="grow">${t}</span><span style="font-size:12.5px;opacity:.75">${n}/${P2.length}</span></div>`;
  tip('בחרו פריט מצד אחד, ואז את ההתאמה שלו בצד השני.');
  host.addEventListener('click',e=>{const b=e.target.closest('.mit');if(!b||b.classList.contains('lock'))return;
    if(b.dataset.ml!=null){$$('[data-ml]',host).forEach(x=>x.classList.remove('pick'));pickL=b}else{$$('[data-mr]',host).forEach(x=>x.classList.remove('pick'));pickR=b}b.classList.add('pick');
    if(pickL&&pickR){if(pickL.dataset.ml===pickR.dataset.mr){n++;[pickL,pickR].forEach(x=>{x.classList.remove('pick');x.classList.add('lock');x.querySelector('.mb').textContent=n});tip(n<P2.length?'נכון! המשיכו.':'כל ההתאמות נכונות!');if(n===P2.length)setTimeout(()=>done('g'),400)}
      else{err++;[pickL,pickR].forEach(x=>{x.classList.remove('pick');x.classList.add('shake');setTimeout(()=>x.classList.remove('shake'),400)});tip('הזוג הזה לא מתאים – נסו שוב.',true)}pickL=pickR=null}});
  return {destroy(){}}
}

/* ===================== order ===================== */
function orderEx(host,foot,ex,done){
  host.innerHTML=`<div class="panel"><div class="pad order"><div class="slots">${ex.steps.map((s,i)=>`<div class="slot${i==0?' next':''}"><span class="sn">${i+1}</span><span class="sv">${ex.big?'':'…'}</span></div>`).join('')}</div><div class="pool${ex.big?' big':''}">${shuffle([...ex.steps.map((s,i)=>({s,i})),...(ex.extra||[]).map(s=>({s,i:-1}))]).map(o=>`<button data-i="${o.i}">${o.s}</button>`).join('')}</div></div></div>`;
  let n=0;const slots=$$('.slot',host);
  const tip=(t,w)=>foot.innerHTML=`<div class="hintbar${w?' warn':''}"><b>${w?'לא עכשיו':'סדר'}</b><span class="grow">${t}</span></div>`;
  tip(ex.tip||'לחצו על השלבים לפי הסדר הנכון – מהראשון לאחרון.');
  host.addEventListener('click',e=>{const b=e.target.closest('.pool button');if(!b||b.classList.contains('gone'))return;
    if(+b.dataset.i===n){slots[n].classList.remove('next');slots[n].classList.add('fill');$('.sv',slots[n]).textContent=b.textContent;b.classList.add('gone');n++;
      if(n<slots.length){slots[n].classList.add('next');tip('נכון! מה השלב הבא?')}else{tip('הסדר נכון!');setTimeout(()=>done('g'),400)}}
    else{b.classList.add('shake');setTimeout(()=>b.classList.remove('shake'),400);tip(+b.dataset.i<0?'השלב הזה לא שייך לתהליך.':'זה שלב אמיתי – אבל לא עכשיו.',true)}});
  return {destroy(){}}
}

/* ===================== spot the errors ===================== */
function spotEx(host,foot,ex,done){
  host.innerHTML=`<div class="panel"><div class="pad spot"><div class="cnt"><span>${ex.lead||'לחצו על כל מקום שבו יש טעות'}</span><span>נמצאו <b class="fc">0</b> מתוך <b>${ex.n}</b></span></div><div class="spotwrap" style="position:relative">${ex.doc}</div><div class="fnd"></div></div></div>`;
  let f=0,miss=0;const wrap=$('.spotwrap',host);
  const tip=(t,w)=>foot.innerHTML=`<div class="hintbar${w?' warn':''}"><b>${w?'תקין':'חיפוש טעויות'}</b><span class="grow">${t}</span>${miss>=3&&f<ex.n?'<button data-hint>הראו לי טעות</button>':''}</div>`;
  tip(ex.tip||'קראו את המסמך ולחצו על כל טעות שאתם מוצאים.');
  host.addEventListener('click',e=>{if(e.target.closest('[data-hint]')){const r=$$('[data-e]:not(.found)',wrap)[0];if(r){r.classList.remove('hintme');void r.offsetWidth;r.classList.add('hintme')}return}
    if(!e.target.closest('.spotwrap'))return;const s=e.target.closest('[data-e]');
    if(s){if(s.classList.contains('found'))return;s.classList.add('found');f++;$('.fc',host).textContent=f;$('.fnd',host).insertAdjacentHTML('afterbegin',`<div><b>${f}.</b> ${s.dataset.e}</div>`);tip(f<ex.n?'מצאתם! המשיכו לחפש.':'מצאתם את כל הטעויות!');if(f===ex.n)setTimeout(()=>done('g'),500)}
    else{miss++;const W=wrap.getBoundingClientRect();const m=document.createElement('div');m.className='miss';m.textContent='כאן זה תקין';m.style.top=(e.clientY-W.top-30)+'px';m.style.left=(e.clientX-W.left-30)+'px';wrap.appendChild(m);setTimeout(()=>m.remove(),900);tip('כאן אין טעות – המשיכו לחפש.',true)}});
  return {destroy(){}}
}

/* ---------- builder ---------- */
const escRe=s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
function macMapper(extra){const map=Object.assign({},MAC.map,extra||{});const keys=Object.keys(map).sort((a,b)=>b.length-a.length);
  const re=new RegExp('(?<![A-Za-z])('+keys.map(escRe).join('|')+')(?![A-Za-z])','g');return s=>s.replace(re,m=>map[m])}
const SKIPK=new Set(['c','cm','k','codes','id','sel','type','app','g','ic','key','f','menu','dlg']);
function deepMap(o,fn,k){if(typeof o==='string')return SKIPK.has(k)?o:fn(o);if(Array.isArray(o))return o.map(x=>deepMap(x,fn,k));
  if(o&&typeof o==='object'){const r={};for(const kk in o)r[kk]=deepMap(o[kk],fn,kk);return r}return o}
function applyOv(l,o){for(const k in o){if(k==='fn')continue;const v=o[k];
  if((k==='cards'||k==='ex')&&v&&!Array.isArray(v)){const arr=l[k].slice();for(const i in v){const x=v[i];arr[i]=(x&&x.type)?x:Object.assign({},arr[i],x);Object.keys(arr[i]).forEach(kk=>arr[i][kk]===null&&delete arr[i][kk])}l[k]=arr}
  else l[k]=v}
  if(o.fn)o.fn(l);return l}
const CH_MAC=CH_WIN.map(c=>{const g=macMapper();const nc=Object.assign({},c,{name:c.name,desc:g(c.desc)},MAC.ch[c.id]||{});
  nc.lessons=c.lessons.map((l,li)=>{const id=c.id+'-'+li;const m=deepMap(l,macMapper(MAC.lmap[id]));return applyOv(m,MAC.L[id]||{})});return nc});
const GUESS_MAC=(()=>{const g=deepMap(GUESS,macMapper());for(const id in MAC.guess){g[id]=Object.assign({},g[id]||{},MAC.guess[id])}return g})();
